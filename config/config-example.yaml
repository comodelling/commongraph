platform_name: CommonGraph-example
platform_tagline: This is an example tagline
platform_description: This is an example description which should support html formatting.

# Beta mode: when true, users without read permission are redirected to /beta page
# When false, they are redirected to /login page instead
beta_mode: false

node_types:
  example_node_type:
    properties:
      - title
      - tags

edge_types:
  example_edge_type:
    properties:
      - description
      - references
      - custom_property_example:
        type: discrete
        question: What's this edge's value
        options:
        - 1: 1
        - 2: 2

polls:
  example_poll_type:
    type: discrete
    question: Is this a question?
    options:
    - 1: "Yes"
    - 2: "No"
    node_types: ["example_node_type"]
    edge_types: []

auth:
  allow_signup: true                    # master on/off
  signup_requires_admin_approval: true  # freshly created users start inactive
  signup_requires_token: false          # require access token for signup (generated by admins)

permissions: # all/loggedin/admin
  read: loggedin
  create: loggedin
  edit: all
  delete: all
  rate: all

# License configuration - displayed to users when viewing/editing content
# Supported CC licenses: CC BY, CC BY-SA, CC BY-NC, CC BY-NC-SA, CC BY-ND, CC BY-NC-ND, CC0, CC PDM
license: "CC BY-SA"
